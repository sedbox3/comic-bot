<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
    <div class="navbar-actions">
      <a href="../index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> الموقع</a>
      <button class="btn btn-danger btn-sm" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <a href="index.html" class="menu-item active">
          <i class="fas fa-chart-pie"></i> الإحصائيات
        </a>
        <a href="comics.html" class="menu-item">
          <i class="fas fa-book"></i> الكوميكس
        </a>
        <a href="chapters.html" class="menu-item">
          <i class="fas fa-list"></i> الفصول
        </a>
        <a href="categories.html" class="menu-item">
          <i class="fas fa-folder"></i> التصنيفات
        </a>
        <a href="settings.html" class="menu-item">
          <i class="fas fa-cog"></i> الإعدادات
        </a>
      </aside>

      <div class="admin-main">
        <h1 class="section-title" style="margin-bottom: 2rem;">
          <span class="icon"><i class="fas fa-chart-pie"></i></span>
          لوحة التحكم
        </h1>

        <div class="admin-stats-grid" id="statsGrid">
          <div class="admin-stat-card">
            <div class="stat-number" id="statComics">0</div>
            <div class="stat-label"><i class="fas fa-book"></i> كوميكس</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-number" id="statChapters">0</div>
            <div class="stat-label"><i class="fas fa-list"></i> فصول</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-number" id="statCategories">0</div>
            <div class="stat-label"><i class="fas fa-folder"></i> تصنيفات</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-number" id="statViews">0</div>
            <div class="stat-label"><i class="fas fa-eye"></i> مشاهدات</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">
          <div class="comic-panel" style="padding: 2rem;">
            <h3 style="font-family: var(--font-comic); margin-bottom: 1rem; color: var(--accent);">
              <i class="fas fa-bolt"></i> إجراءات سريعة
            </h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              <a href="comics.html?action=add" class="btn btn-primary" style="justify-content: center;">
                <i class="fas fa-plus"></i> إضافة كوميكس جديد
              </a>
              <a href="chapters.html" class="btn btn-secondary" style="justify-content: center;">
                <i class="fas fa-upload"></i> إضافة فصول
              </a>
              <a href="categories.html" class="btn btn-secondary" style="justify-content: center;">
                <i class="fas fa-folder-plus"></i> إدارة التصنيفات
              </a>
            </div>
          </div>

          <div class="comic-panel" style="padding: 2rem;">
            <h3 style="font-family: var(--font-comic); margin-bottom: 1rem; color: var(--accent2);">
              <i class="fas fa-info-circle"></i> معلومات
            </h3>
            <div style="color: var(--text-secondary); line-height: 2;">
              <p><strong>الموقع:</strong> Sedbox Comics</p>
              <p><strong>الإصدار:</strong> 2.0</p>
              <p><strong>الخادم:</strong> Firebase</p>
              <p><strong>الاستضافة:</strong> Netlify</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      
      const stats = await DB.getStats();
      document.getElementById('statComics').textContent = stats.totalComics;
      document.getElementById('statChapters').textContent = stats.totalChapters;
      document.getElementById('statCategories').textContent = stats.totalCategories;
      document.getElementById('statViews').textContent = UI.formatNumber(stats.totalViews);
    });
  </script>
</body>
</html>
