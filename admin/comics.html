<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الكوميكس - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
    <div class="navbar-actions">
      <a href="../index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> الموقع</a>
      <button class="btn btn-danger btn-sm" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> الإحصائيات</a>
        <a href="comics.html" class="menu-item active"><i class="fas fa-book"></i> الكوميكس</a>
        <a href="chapters.html" class="menu-item"><i class="fas fa-list"></i> الفصول</a>
        <a href="categories.html" class="menu-item"><i class="fas fa-folder"></i> التصنيفات</a>
        <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> الإعدادات</a>
      </aside>

      <div class="admin-main">
        <div class="section-header">
          <h1 class="section-title">
            <span class="icon"><i class="fas fa-book"></i></span>
            إدارة الكوميكس
          </h1>
          <button class="btn btn-primary" onclick="showAddForm()">
            <i class="fas fa-plus"></i> إضافة كوميكس
          </button>
        </div>

        <div id="alertBox"></div>

        <div id="addForm" style="display: none;">
          <div class="admin-form" style="margin-bottom: 2rem;">
            <h2 style="font-family: var(--font-comic); margin-bottom: 1.5rem; color: var(--accent);">
              <i class="fas fa-plus-circle"></i> إضافة كوميكس جديد
            </h2>
            <form id="comicForm">
              <div class="form-group">
                <label>عنوان الكوميكس *</label>
                <input type="text" id="comicTitle" placeholder="مثال: ون بيس" required>
              </div>
              <div class="form-group">
                <label>التصنيف *</label>
                <select id="comicCategory" required></select>
              </div>
              <div class="form-group">
                <label>الوصف</label>
                <textarea id="comicDesc" placeholder="وصف مختصر للكوميكس..."></textarea>
              </div>
              <div class="form-group">
                <label>المؤلف</label>
                <input type="text" id="comicAuthor" placeholder="اسم المؤلف">
              </div>
              <div class="form-group">
                <label>الغلاف *</label>
                <div class="drop-zone" id="coverDropZone">
                  <div class="drop-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                  <p>اسحب صورة الغلاف هنا أو انقر للاختيار</p>
                  <input type="file" id="coverInput" accept="image/*" style="display: none;">
                </div>
                <div id="coverPreview" style="margin-top: 1rem;"></div>
              </div>
              <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> حفظ</button>
                <button type="button" class="btn btn-secondary" onclick="hideAddForm()"><i class="fas fa-times"></i> إلغاء</button>
              </div>
            </form>
          </div>
        </div>

        <div id="comicsList"></div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    let coverFile = null;

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      
      const categories = await DB.getCategories();
      const select = document.getElementById('comicCategory');
      select.innerHTML = '<option value="">اختر التصنيف</option>' +
        categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

      if (window.location.search.includes('action=add')) {
        showAddForm();
      }

      loadComics();
    });

    document.getElementById('coverDropZone').addEventListener('click', () => {
      document.getElementById('coverInput').click();
    });

    document.getElementById('coverInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        coverFile = file;
        const reader = new FileReader();
        reader.onload = function(ev) {
          document.getElementById('coverPreview').innerHTML = `
            <div class="preview-item" style="max-width: 150px;">
              <img src="${ev.target.result}" alt="غلاف">
            </div>`;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('comicForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('comicTitle').value.trim();
      const category = document.getElementById('comicCategory').value;
      const description = document.getElementById('comicDesc').value.trim();
      const author = document.getElementById('comicAuthor').value.trim();

      if (!title || !category) {
        showAlert('يرجى ملء جميع الحقول المطلوبة', 'danger');
        return;
      }

      let coverData = null;
      if (coverFile) {
        coverData = await DB.compressImage(coverFile, 1200, 1600, 0.92);
      }

      const comicData = {
        title, category, description, author,
        cover: coverData || '',
        views: 0, rating: 0
      };

      const result = await DB.addComic(comicData);
      if (result) {
        showAlert('تم إضافة الكوميكس بنجاح!', 'success');
        hideAddForm();
        loadComics();
      } else {
        showAlert('حدث خطأ أثناء الحفظ', 'danger');
      }
    });

    async function loadComics() {
      const comics = await DB.getLatestComics(100);
      if (comics.length === 0) {
        document.getElementById('comicsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-book-open"></i></div>
            <h3>لا يوجد كوميكس بعد</h3>
            <p>ابدأ بإضافة أول كوميكس.</p>
          </div>`;
        return;
      }

      document.getElementById('comicsList').innerHTML = `
        <div class="comics-grid">
          ${comics.map(comic => `
            <div class="comic-card fade-in">
              <div class="cover">
                <img src="${comic.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" alt="${comic.title}">
                <div class="badge chapter-count">${comic.category || ''}</div>
              </div>
              <div class="card-info">
                <div class="card-title">${comic.title}</div>
                <div class="card-meta">
                  <span class="card-views"><i class="fas fa-eye"></i> ${UI.formatNumber(comic.views || 0)}</span>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                  <button class="btn btn-danger btn-sm" onclick="deleteComic('${comic.id}', '${comic.title}')">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function showAddForm() {
      document.getElementById('addForm').style.display = 'block';
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    function hideAddForm() {
      document.getElementById('addForm').style.display = 'none';
      document.getElementById('comicForm').reset();
      document.getElementById('coverPreview').innerHTML = '';
      coverFile = null;
    }

    async function deleteComic(id, title) {
      if (confirm(`هل أنت متأكد من حذف "${title}"؟`)) {
        const result = await DB.deleteComic(id);
        if (result) {
          showAlert('تم الحذف بنجاح', 'success');
          loadComics();
        }
      }
    }

    function showAlert(msg, type) {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 3000);
    }
  </script>
</body>
</html>
