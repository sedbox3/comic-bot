<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التصنيفات - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
    <div class="navbar-actions">
      <a href="../index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> الموقع</a>
      <button class="btn btn-danger btn-sm" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> الإحصائيات</a>
        <a href="comics.html" class="menu-item"><i class="fas fa-book"></i> الكوميكس</a>
        <a href="chapters.html" class="menu-item"><i class="fas fa-list"></i> الفصول</a>
        <a href="categories.html" class="menu-item active"><i class="fas fa-folder"></i> التصنيفات</a>
        <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> الإعدادات</a>
      </aside>

      <div class="admin-main">
        <div class="section-header">
          <h1 class="section-title">
            <span class="icon"><i class="fas fa-folder"></i></span>
            إدارة التصنيفات
          </h1>
        </div>

        <div id="alertBox"></div>

        <div class="admin-form" style="margin-bottom: 2rem; max-width: 500px;">
          <h2 style="font-family: var(--font-comic); margin-bottom: 1.5rem; color: var(--accent);">
            <i class="fas fa-plus-circle"></i> إضافة تصنيف جديد
          </h2>
          <form id="categoryForm">
            <div class="form-group">
              <label>اسم التصنيف *</label>
              <input type="text" id="categoryName" placeholder="مثال: أكشن" required>
            </div>
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> حفظ</button>
          </form>
        </div>

        <div id="categoriesList"></div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      loadCategories();
    });

    document.getElementById('categoryForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('categoryName').value.trim();
      if (!name) {
        showAlert('يرجى إدخال اسم التصنيف', 'danger');
        return;
      }

      const result = await DB.addCategory(name);
      if (result) {
        showAlert('تم إضافة التصنيف بنجاح!', 'success');
        document.getElementById('categoryName').value = '';
        loadCategories();
      } else {
        showAlert('حدث خطأ أو التصنيف موجود مسبقاً', 'danger');
      }
    });

    async function loadCategories() {
      const categories = await DB.getCategories();
      
      if (categories.length === 0) {
        document.getElementById('categoriesList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-folder-open"></i></div>
            <h3>لا توجد تصنيفات بعد</h3>
            <p>ابدأ بإضافة أول تصنيف.</p>
          </div>`;
        return;
      }

      document.getElementById('categoriesList').innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;">
          ${categories.map(cat => `
            <div class="comic-panel" style="padding: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 50px; height: 50px; background: var(--accent); border: 3px solid #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 3px 3px 0 #000;">
                  <i class="fas fa-folder"></i>
                </div>
                <div>
                  <div style="font-weight: 700; font-size: 1.1rem;">${cat.name}</div>
                </div>
              </div>
              <button class="btn btn-danger btn-sm" onclick="deleteCategory('${cat.id}', '${cat.name}')">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          `).join('')}
        </div>`;
    }

    async function deleteCategory(id, name) {
      if (confirm(`هل أنت متأكد من حذف "${name}"؟`)) {
        const result = await DB.deleteCategory(id);
        if (result) {
          showAlert('تم الحذف بنجاح', 'success');
          loadCategories();
        }
      }
    }

    function showAlert(msg, type) {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 3000);
    }
  </script>
</body>
</html>
