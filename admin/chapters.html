<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Chapters - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0f0f13', 800: '#13131a', 700: '#1a1a24', 600: '#22222e', 500: '#2a2a38' },
            accent: { DEFAULT: '#7c3aed', light: '#8b5cf6', dark: '#6d28d9' },
            golden: '#fbbf24'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    .glass { background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(12px); }
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 64px); margin-top: 64px; }
    @media (max-width: 1024px) { .admin-layout { grid-template-columns: 1fr; } .admin-sidebar { display: none; } }
    .admin-sidebar { background: #13131a; border-left: 2px solid #22222e; padding: 1.5rem 0; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
    .admin-sidebar .menu-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.5rem; color: #9ca3af; font-weight: 600; transition: all 0.2s; border-right: 3px solid transparent; }
    .admin-sidebar .menu-item:hover, .admin-sidebar .menu-item.active { color: #7c3aed; background: rgba(124, 58, 237, 0.1); border-right-color: #7c3aed; }
  </style>
</head>
<body class="bg-dark-900 text-white font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-dark-600">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-accent/30">
          <i class="fas fa-book-open text-white text-lg"></i>
        </div>
        <span class="text-xl font-bold">Sed<span class="text-accent">box</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="../index.html" class="bg-dark-700 hover:bg-dark-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-home"></i> Site
        </a>
        <button onclick="DB.logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="comics.html" class="menu-item"><i class="fas fa-book"></i> Comics</a>
      <a href="chapters.html" class="menu-item active"><i class="fas fa-list"></i> Chapters</a>
      <a href="categories.html" class="menu-item"><i class="fas fa-folder"></i> Categories</a>
      <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> Settings</a>
    </aside>

    <!-- Main Content -->
    <div class="p-6 lg:p-8">
      <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold flex items-center gap-3">
          <span class="w-12 h-12 bg-accent/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-list text-accent text-xl"></i>
          </span>
          Manage Chapters
        </h1>
        <button onclick="showAddForm()" class="bg-accent hover:bg-accent-dark text-white px-5 py-2.5 rounded-xl font-semibold transition flex items-center gap-2 shadow-lg shadow-accent/30">
          <i class="fas fa-plus"></i> Add Chapter
        </button>
      </div>

      <div id="alertBox"></div>

      <!-- Add Form -->
      <div id="addForm" class="hidden mb-8">
        <div class="bg-dark-700 rounded-2xl border border-dark-500 p-6 lg:p-8">
          <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
            <i class="fas fa-plus-circle text-accent"></i> Add New Chapter
          </h2>
          <form id="chapterForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Comic *</label>
                <select id="chapterComic" required
                        class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent transition">
                  <option value="">Select Comic</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Chapter Number *</label>
                <input type="number" id="chapterNumber" min="1" placeholder="1" required
                       class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Title *</label>
                <input type="text" id="chapterTitle" placeholder="Chapter title" required
                       class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
              </div>
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-2">Pages *</label>
              <div class="border-2 border-dashed border-dark-500 rounded-xl p-8 text-center cursor-pointer hover:border-accent transition" id="pagesDropZone">
                <i class="fas fa-images text-4xl text-gray-500 mb-3"></i>
                <p class="text-gray-400">Click or drag images here</p>
                <p class="text-gray-600 text-sm mt-1">You can select multiple files</p>
                <input type="file" id="pagesInput" accept="image/*" multiple class="hidden">
              </div>
              <div id="pagesPreview" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 mt-4"></div>
            </div>
            
            <div class="flex gap-3">
              <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-semibold transition flex items-center gap-2">
                <i class="fas fa-save"></i> Save Chapter
              </button>
              <button type="button" onclick="hideAddForm()" class="bg-dark-600 hover:bg-dark-500 text-white px-6 py-3 rounded-xl font-semibold transition">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Chapters Table -->
      <div id="chaptersList"></div>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    let pageFiles = [];

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      loadComics();
    });

    async function loadComics() {
      const comics = await DB.getLatestComics(200);
      const select = document.getElementById('chapterComic');
      select.innerHTML = '<option value="">Select Comic</option>' +
        comics.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
      loadChapters();
    }

    document.getElementById('pagesDropZone').addEventListener('click', () => {
      document.getElementById('pagesInput').click();
    });

    document.getElementById('pagesInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (!pageFiles.find(f => f.name === file.name && f.size === file.size)) {
          pageFiles.push(file);
        }
      });
      renderPreviews();
    });

    document.getElementById('pagesDropZone').addEventListener('dragover', (e) => {
      e.preventDefault();
      e.currentTarget.classList.add('border-accent');
    });

    document.getElementById('pagesDropZone').addEventListener('dragleave', (e) => {
      e.currentTarget.classList.remove('border-accent');
    });

    document.getElementById('pagesDropZone').addEventListener('drop', (e) => {
      e.preventDefault();
      e.currentTarget.classList.remove('border-accent');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      files.forEach(file => {
        if (!pageFiles.find(f => f.name === file.name && f.size === file.size)) {
          pageFiles.push(file);
        }
      });
      renderPreviews();
    });

    function renderPreviews() {
      const container = document.getElementById('pagesPreview');
      container.innerHTML = '';
      pageFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const div = document.createElement('div');
          div.className = 'relative aspect-[3/4] rounded-lg overflow-hidden border-2 border-dark-500';
          div.innerHTML = `
            <img src="${ev.target.result}" alt="Page ${index + 1}" class="w-full h-full object-cover">
            <button type="button" onclick="removePage(${index})" class="absolute top-1 left-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-xs text-white">
              <i class="fas fa-times"></i>
            </button>
            <div class="absolute bottom-1 right-1 bg-black/70 text-xs px-1.5 py-0.5 rounded">${index + 1}</div>
          `;
          container.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    function removePage(index) {
      pageFiles.splice(index, 1);
      renderPreviews();
    }

    document.getElementById('chapterForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const comicId = document.getElementById('chapterComic').value;
      const chapterNumber = parseInt(document.getElementById('chapterNumber').value);
      const chapterTitle = document.getElementById('chapterTitle').value.trim();

      if (!comicId || !chapterTitle) {
        showAlert('Please fill all required fields', 'danger');
        return;
      }

      if (pageFiles.length === 0) {
        showAlert('Please select at least one image', 'danger');
        return;
      }

      showAlert('Uploading images, please wait...', 'warning');

      const images = [];
      for (const file of pageFiles) {
        const base64 = await DB.compressImage(file, 1200, 1600, 0.85);
        images.push(base64);
      }

      const result = await DB.addChapter({ comicId, number: chapterNumber, title: chapterTitle, images });
      
      if (result) {
        showAlert('Chapter added successfully!', 'success');
        hideAddForm();
        loadChapters();
      } else {
        showAlert('Error saving chapter', 'danger');
      }
    });

    async function loadChapters() {
      const comics = await DB.getLatestComics(200);
      let allChapters = [];
      
      for (const comic of comics) {
        const chapters = await DB.getChapters(comic.id);
        chapters.forEach(ch => allChapters.push({ ...ch, comicTitle: comic.title, comicId: comic.id }));
      }

      allChapters.sort((a, b) => (b.number || 0) - (a.number || 0));

      if (allChapters.length === 0) {
        document.getElementById('chaptersList').innerHTML = `
          <div class="text-center py-16 bg-dark-700 rounded-2xl border border-dark-500">
            <i class="fas fa-list text-5xl text-gray-600 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">No Chapters Yet</h3>
            <p class="text-gray-500">Start by adding your first chapter.</p>
          </div>`;
        return;
      }

      document.getElementById('chaptersList').innerHTML = `
        <div class="bg-dark-700 rounded-2xl border border-dark-500 overflow-hidden">
          <table class="w-full">
            <thead>
              <tr class="border-b border-dark-500">
                <th class="text-left p-4 text-gray-400 font-semibold">Comic</th>
                <th class="text-left p-4 text-gray-400 font-semibold">Ch.</th>
                <th class="text-left p-4 text-gray-400 font-semibold">Title</th>
                <th class="text-left p-4 text-gray-400 font-semibold">Pages</th>
                <th class="text-center p-4 text-gray-400 font-semibold">Action</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-dark-500">
              ${allChapters.slice(0, 50).map(ch => `
                <tr class="hover:bg-dark-600 transition">
                  <td class="p-4 font-medium">${ch.comicTitle}</td>
                  <td class="p-4">${ch.number || '-'}</td>
                  <td class="p-4">${ch.title}</td>
                  <td class="p-4 text-gray-400">${ch.images ? ch.images.length : 0} pages</td>
                  <td class="p-4 text-center">
                    <button onclick="deleteChapter('${ch.comicId}', '${ch.id}')" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-3 py-1.5 rounded-lg text-sm transition">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function showAddForm() {
      document.getElementById('addForm').classList.remove('hidden');
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    function hideAddForm() {
      document.getElementById('addForm').classList.add('hidden');
      document.getElementById('chapterForm').reset();
      document.getElementById('pagesPreview').innerHTML = '';
      pageFiles = [];
    }

    async function deleteChapter(comicId, chapterId) {
      if (confirm('Delete this chapter?')) {
        const result = await DB.deleteChapter(comicId, chapterId);
        if (result) {
          showAlert('Deleted successfully', 'success');
          loadChapters();
        }
      }
    }

    function showAlert(msg, type) {
      const colors = {
        success: 'bg-green-500/20 border-green-500/50 text-green-400',
        danger: 'bg-red-500/20 border-red-500/50 text-red-400',
        warning: 'bg-golden/20 border-golden/50 text-golden'
      };
      document.getElementById('alertBox').innerHTML = `
        <div class="${colors[type]} border px-4 py-3 rounded-xl text-sm font-medium mb-4">${msg}</div>`;
      if (type !== 'warning') setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 3000);
    }
  </script>
</body>
</html>
