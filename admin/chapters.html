<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الفصول - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
    <div class="navbar-actions">
      <a href="../index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> الموقع</a>
      <button class="btn btn-danger btn-sm" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> الإحصائيات</a>
        <a href="comics.html" class="menu-item"><i class="fas fa-book"></i> الكوميكس</a>
        <a href="chapters.html" class="menu-item active"><i class="fas fa-list"></i> الفصول</a>
        <a href="categories.html" class="menu-item"><i class="fas fa-folder"></i> التصنيفات</a>
        <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i> الإعدادات</a>
      </aside>

      <div class="admin-main">
        <div class="section-header">
          <h1 class="section-title">
            <span class="icon"><i class="fas fa-list"></i></span>
            إدارة الفصول
          </h1>
          <button class="btn btn-primary" onclick="showAddForm()">
            <i class="fas fa-plus"></i> إضافة فصل
          </button>
        </div>

        <div id="alertBox"></div>

        <div id="addForm" style="display: none;">
          <div class="admin-form" style="margin-bottom: 2rem;">
            <h2 style="font-family: var(--font-comic); margin-bottom: 1.5rem; color: var(--accent);">
              <i class="fas fa-plus-circle"></i> إضافة فصل جديد
            </h2>
            <form id="chapterForm">
              <div class="form-group">
                <label>الكوميكس *</label>
                <select id="chapterComic" required></select>
              </div>
              <div class="form-group">
                <label>رقم الفصل *</label>
                <input type="number" id="chapterNumber" min="1" placeholder="1" required>
              </div>
              <div class="form-group">
                <label>عنوان الفصل *</label>
                <input type="text" id="chapterTitle" placeholder="مثال: البداية" required>
              </div>
              <div class="form-group">
                <label>صور الفصل *</label>
                <div class="drop-zone" id="pagesDropZone">
                  <div class="drop-icon"><i class="fas fa-images"></i></div>
                  <p>اسحب الصور هنا أو انقر للاختيار</p>
                  <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">يمكنك اختيار عدة صور دفعة واحدة</p>
                  <input type="file" id="pagesInput" accept="image/*" multiple style="display: none;">
                </div>
                <div id="pagesPreview" class="upload-preview"></div>
              </div>
              <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> حفظ الفصل</button>
                <button type="button" class="btn btn-secondary" onclick="hideAddForm()"><i class="fas fa-times"></i> إلغاء</button>
              </div>
            </form>
          </div>
        </div>

        <div id="chaptersList"></div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    let pageFiles = [];

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      loadComics();
    });

    async function loadComics() {
      const comics = await DB.getLatestComics(200);
      const select = document.getElementById('chapterComic');
      select.innerHTML = '<option value="">اختر الكوميكس</option>' +
        comics.map(c => `<option value="${c.id}">${c.title}</option>`).join('');

      loadChapters();
    }

    document.getElementById('pagesDropZone').addEventListener('click', () => {
      document.getElementById('pagesInput').click();
    });

    document.getElementById('pagesInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (!pageFiles.find(f => f.name === file.name && f.size === file.size)) {
          pageFiles.push(file);
        }
      });
      renderPreviews();
    });

    document.getElementById('pagesDropZone').addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('pagesDropZone').classList.add('dragover');
    });

    document.getElementById('pagesDropZone').addEventListener('dragleave', () => {
      document.getElementById('pagesDropZone').classList.remove('dragover');
    });

    document.getElementById('pagesDropZone').addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('pagesDropZone').classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      files.forEach(file => {
        if (!pageFiles.find(f => f.name === file.name && f.size === file.size)) {
          pageFiles.push(file);
        }
      });
      renderPreviews();
    });

    function renderPreviews() {
      const container = document.getElementById('pagesPreview');
      container.innerHTML = '';
      pageFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(ev) {
          container.innerHTML += `
            <div class="preview-item">
              <img src="${ev.target.result}" alt="صفحة ${index + 1}">
              <div class="remove-btn" onclick="removePage(${index})">
                <i class="fas fa-times"></i>
              </div>
            </div>`;
        };
        reader.readAsDataURL(file);
      });
    }

    function removePage(index) {
      pageFiles.splice(index, 1);
      renderPreviews();
    }

    document.getElementById('chapterForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const comicId = document.getElementById('chapterComic').value;
      const chapterNumber = parseInt(document.getElementById('chapterNumber').value);
      const chapterTitle = document.getElementById('chapterTitle').value.trim();

      if (!comicId || !chapterTitle) {
        showAlert('يرجى ملء جميع الحقول', 'danger');
        return;
      }

      if (pageFiles.length === 0) {
        showAlert('يرجى اختيار صور الفصل', 'danger');
        return;
      }

      showAlert('جاري رفع الصور، يرجى الانتظار...', 'warning');

      const images = [];
      for (const file of pageFiles) {
        const base64 = await DB.compressImage(file, 1200, 1600, 0.85);
        images.push(base64);
      }

      const chapterData = {
        comicId,
        number: chapterNumber,
        title: chapterTitle,
        images
      };

      const result = await DB.addChapter(chapterData);
      if (result) {
        showAlert('تم إضافة الفصل بنجاح!', 'success');
        hideAddForm();
        loadChapters();
      } else {
        showAlert('حدث خطأ أثناء الحفظ', 'danger');
      }
    });

    async function loadChapters() {
      const comics = await DB.getLatestComics(200);
      const comicsMap = {};
      comics.forEach(c => { comicsMap[c.id] = c.title; });

      let allChapters = [];
      for (const comic of comics) {
        const chapters = await DB.getChapters(comic.id);
        chapters.forEach(ch => {
          allChapters.push({ ...ch, comicTitle: comic.title });
        });
      }

      allChapters.sort((a, b) => (b.number || 0) - (a.number || 0));

      if (allChapters.length === 0) {
        document.getElementById('chaptersList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-list"></i></div>
            <h3>لا توجد فصول بعد</h3>
            <p>ابدأ بإضافة أول فصل.</p>
          </div>`;
        return;
      }

      document.getElementById('chaptersList').innerHTML = `
        <div class="admin-table" style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="background: var(--bg-secondary); border-bottom: 3px solid var(--accent);">
                <th style="padding: 1rem; text-align: right;">الكوميكس</th>
                <th style="padding: 1rem; text-align: right;">رقم الفصل</th>
                <th style="padding: 1rem; text-align: right;">العنوان</th>
                <th style="padding: 1rem; text-align: right;">الصور</th>
                <th style="padding: 1rem; text-align: center;">الإجراءات</th>
              </tr>
            </thead>
            <tbody>
              ${allChapters.slice(0, 50).map(ch => `
                <tr style="border-bottom: 2px solid var(--border);">
                  <td style="padding: 1rem;">${ch.comicTitle}</td>
                  <td style="padding: 1rem;">${ch.number || '-'}</td>
                  <td style="padding: 1rem; font-weight: 700;">${ch.title}</td>
                  <td style="padding: 1rem;">${ch.images ? ch.images.length : 0} صفحة</td>
                  <td style="padding: 1rem; text-align: center;">
                    <button class="btn btn-danger btn-sm" onclick="deleteChapter('${ch.comicId}', '${ch.id}')">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function showAddForm() {
      document.getElementById('addForm').style.display = 'block';
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    function hideAddForm() {
      document.getElementById('addForm').style.display = 'none';
      document.getElementById('chapterForm').reset();
      document.getElementById('pagesPreview').innerHTML = '';
      pageFiles = [];
    }

    async function deleteChapter(comicId, chapterId) {
      if (confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
        const result = await DB.deleteChapter(comicId, chapterId);
        if (result) {
          showAlert('تم الحذف بنجاح', 'success');
          loadChapters();
        }
      }
    }

    function showAlert(msg, type) {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 5000);
    }
  </script>
</body>
</html>
