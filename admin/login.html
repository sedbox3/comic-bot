<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0f0f13', 800: '#13131a', 700: '#1a1a24', 600: '#22222e', 500: '#2a2a38' },
            accent: { DEFAULT: '#7c3aed', light: '#8b5cf6', dark: '#6d28d9' },
            golden: '#fbbf24'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    .glass { background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-dark-900 text-white font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-dark-600">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-accent/30">
          <i class="fas fa-book-open text-white text-lg"></i>
        </div>
        <span class="text-xl font-bold">Sed<span class="text-accent">box</span></span>
      </a>
      <a href="../index.html" class="text-gray-400 hover:text-white transition flex items-center gap-2 text-sm">
        <i class="fas fa-arrow-right"></i> Back to Site
      </a>
    </div>
  </nav>

  <!-- Login Page -->
  <main class="min-h-screen flex items-center justify-center pt-16 px-4" style="background: linear-gradient(135deg, #0f0f13 0%, #1a1025 50%, #0f0f13 100%);">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-accent rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-accent/30 rotate-3">
          <i class="fas fa-user-shield text-3xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold">Admin Panel</h1>
        <p class="text-gray-400 mt-2">Sign in to manage content</p>
      </div>
      
      <div class="bg-dark-700 rounded-2xl border border-dark-500 p-8 shadow-2xl">
        <div id="alertBox"></div>
        
        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Username</label>
            <div class="relative">
              <input type="text" id="username" placeholder="Enter username" required
                     class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 pl-12 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
              <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" placeholder="Enter password" required
                     class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 pl-12 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
          </div>
          
          <button type="submit" class="w-full bg-accent hover:bg-accent-dark text-white py-3 rounded-xl font-semibold transition shadow-lg shadow-accent/30 flex items-center justify-center gap-2">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') === 'true') {
      window.location.href = 'index.html';
    }
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alertBox');

      if (!username || !password) {
        alertBox.innerHTML = '<div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-medium">Please fill all fields</div>';
        return;
      }

      try {
        await DB.init();
        const success = await DB.login(username, password);
        if (success) {
          localStorage.setItem('admin_logged', 'true');
          window.location.href = 'index.html';
        } else {
          alertBox.innerHTML = '<div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-medium">Invalid username or password</div>';
        }
      } catch (error) {
        alertBox.innerHTML = '<div class="bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-medium">Connection error</div>';
      }
    });
  </script>
</body>
</html>
