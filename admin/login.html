<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
  </nav>

  <main class="main-content">
    <div class="login-page">
      <div class="login-card fade-in">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="width: 80px; height: 80px; background: var(--accent); border: 4px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 2rem; color: #fff; box-shadow: 5px 5px 0 #000;">
            <i class="fas fa-user-shield"></i>
          </div>
        </div>
        <h2>لوحة التحكم</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">سجّل الدخول لإدارة المحتوى</p>
        
        <div id="loginAlert"></div>
        
        <form id="loginForm">
          <div class="form-group">
            <label><i class="fas fa-user"></i> اسم المستخدم</label>
            <input type="text" id="username" placeholder="اسم المستخدم" required autocomplete="username">
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> كلمة المرور</label>
            <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
          </button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
          <a href="../index.html" style="color: var(--accent);"><i class="fas fa-arrow-right"></i> العودة للموقع</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertDiv = document.getElementById('loginAlert');

      if (!username || !password) {
        alertDiv.innerHTML = '<div class="alert alert-danger">يرجى ملء جميع الحقول</div>';
        return;
      }

      try {
        await DB.init();
        const success = await DB.login(username, password);
        if (success) {
          localStorage.setItem('admin_logged', 'true');
          window.location.href = 'index.html';
        } else {
          alertDiv.innerHTML = '<div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة</div>';
        }
      } catch (error) {
        alertDiv.innerHTML = '<div class="alert alert-danger">حدث خطأ أثناء الاتصال</div>';
      }
    });

    if (localStorage.getItem('admin_logged') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
