<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent); width:32px; height:32px;">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      لوحة التحكم
    </a>
    <div class="navbar-actions">
      <a href="../index.html" class="btn btn-sm btn-secondary">
        <i class="fas fa-external-link-alt"></i> زيارة الموقع
      </a>
      <button class="btn btn-sm btn-danger" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> خروج
      </button>
    </div>
  </nav>

  <main class="main-content">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-menu">
          <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> الإحصائيات</a>
          <a href="comics.html" class="menu-item"><i class="fas fa-book"></i> الكوميكس</a>
          <a href="chapters.html" class="menu-item"><i class="fas fa-book-open"></i> الفصول</a>
          <a href="categories.html" class="menu-item"><i class="fas fa-folder"></i> التصنيفات</a>
          <a href="settings.html" class="menu-item active"><i class="fas fa-cog"></i> الإعدادات</a>
        </div>
      </aside>

      <div class="admin-main">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 2rem;">
          <i class="fas fa-cog" style="color: var(--accent);"></i>
          إعدادات الموقع
        </h1>

        <div id="alertBox"></div>

        <!-- إعدادات عامة -->
        <div class="admin-form" style="margin-bottom: 2rem;">
          <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">
            <i class="fas fa-globe" style="color: var(--accent);"></i>
            الإعدادات العامة
          </h3>
          
          <form onsubmit="saveSettings(event)">
            <div class="form-group">
              <label>اسم الموقع</label>
              <input type="text" id="siteName" placeholder="كوميكس عربية">
            </div>
            
            <div class="form-group">
              <label>وصف الموقع</label>
              <textarea id="siteDesc" placeholder="أكبر مكتبة كوميكس عربية"></textarea>
            </div>
            
            <div class="form-group">
              <label>عدد العناصر في الصفحة</label>
              <input type="number" id="itemsPerPage" min="4" max="50" value="20">
            </div>
            
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> حفظ الإعدادات
            </button>
          </form>
        </div>

        <!-- تغيير كلمة المرور -->
        <div class="admin-form" style="margin-bottom: 2rem;">
          <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">
            <i class="fas fa-lock" style="color: var(--accent);"></i>
            تغيير كلمة المرور
          </h3>
          
          <form onsubmit="changePassword(event)">
            <div class="form-group">
              <label>كلمة المرور الحالية *</label>
              <input type="password" id="currentPass" required>
            </div>
            
            <div class="form-group">
              <label>كلمة المرور الجديدة *</label>
              <input type="password" id="newPass" required minlength="6">
            </div>
            
            <div class="form-group">
              <label>تأكيد كلمة المرور الجديدة *</label>
              <input type="password" id="confirmPass" required>
            </div>
            
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-key"></i> تغيير كلمة المرور
            </button>
          </form>
        </div>

        <!-- تصدير البيانات -->
        <div class="admin-form">
          <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">
            <i class="fas fa-download" style="color: var(--accent);"></i>
            إدارة البيانات
          </h3>
          
          <p style="color: var(--text-secondary); margin-bottom: 1rem;">
            يمكنك تصدير جميع البيانات كملف نسخ احتياطي أو استيرادها.
          </p>
          
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="exportData()">
              <i class="fas fa-download"></i> تصدير البيانات
            </button>
            <label class="btn btn-secondary" style="cursor: pointer;">
              <i class="fas fa-upload"></i> استيراد البيانات
              <input type="file" accept=".json" style="display: none;" onchange="importData(this.files[0])">
            </label>
            <button class="btn btn-danger" onclick="resetData()">
              <i class="fas fa-redo"></i> إعادة تعيين البيانات
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    if (!DB.isAdmin()) window.location.href = 'login.html';

    document.addEventListener('DOMContentLoaded', function() {
      const settings = DB.load(DB.KEYS.SETTINGS) || {};
      document.getElementById('siteName').value = settings.siteName || '';
      document.getElementById('siteDesc').value = settings.siteDescription || '';
      document.getElementById('itemsPerPage').value = settings.itemsPerPage || 20;
      UI.loadTheme();
    });

    function saveSettings(e) {
      e.preventDefault();
      const settings = DB.load(DB.KEYS.SETTINGS) || {};
      settings.siteName = document.getElementById('siteName').value.trim();
      settings.siteDescription = document.getElementById('siteDesc').value.trim();
      settings.itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
      DB.save(DB.KEYS.SETTINGS, settings);
      UI.showAlert('تم حفظ الإعدادات بنجاح!', 'success');
    }

    function changePassword(e) {
      e.preventDefault();
      const current = document.getElementById('currentPass').value;
      const newPass = document.getElementById('newPass').value;
      const confirm = document.getElementById('confirmPass').value;

      const admin = DB.load(DB.KEYS.ADMIN);
      if (admin.password !== btoa(current)) {
        UI.showAlert('كلمة المرور الحالية غير صحيحة!', 'danger');
        return;
      }

      if (newPass !== confirm) {
        UI.showAlert('كلمتا المرور الجديدتان غير متطابقتين!', 'warning');
        return;
      }

      admin.password = btoa(newPass);
      DB.save(DB.KEYS.ADMIN, admin);
      document.getElementById('currentPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
      UI.showAlert('تم تغيير كلمة المرور بنجاح!', 'success');
    }

    function exportData() {
      const data = {};
      Object.values(DB.KEYS).forEach(key => {
        data[key] = DB.load(key);
      });
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `comicx-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      UI.showAlert('تم تصدير البيانات بنجاح!', 'success');
    }

    function importData(file) {
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          Object.entries(data).forEach(([key, value]) => {
            if (value) DB.save(key, value);
          });
          UI.showAlert('تم استيراد البيانات بنجاح! يتم إعادة تحميل الصفحة...', 'success');
          setTimeout(() => location.reload(), 1500);
        } catch (err) {
          UI.showAlert('خطأ في ملف البيانات!', 'danger');
        }
      };
      reader.readAsText(file);
    }

    function resetData() {
      if (confirm('هل أنت متأكد من إعادة تعيين جميع البيانات؟ سيتم حذف جميع الكوميكس والفصول المضافة.')) {
        if (confirm('تأكيد نهائي: سيتم حذف جميع البيانات المخصصة!')) {
          Object.values(DB.KEYS).forEach(key => {
            if (key !== DB.KEYS.ADMIN) DB.remove(key);
          });
          DB.init();
          UI.showAlert('تم إعادة تعيين البيانات! يتم إعادة تحميل الصفحة...', 'success');
          setTimeout(() => location.reload(), 1500);
        }
      }
    }

    function handleLogout() {
      DB.logout();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
