<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0f0f13', 800: '#13131a', 700: '#1a1a24', 600: '#22222e', 500: '#2a2a38' },
            accent: { DEFAULT: '#7c3aed', light: '#8b5cf6', dark: '#6d28d9' },
            golden: '#fbbf24'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    .glass { background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(12px); }
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 64px); margin-top: 64px; }
    @media (max-width: 1024px) { .admin-layout { grid-template-columns: 1fr; } .admin-sidebar { display: none; } }
    .admin-sidebar { background: #13131a; border-left: 2px solid #22222e; padding: 1.5rem 0; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
    .admin-sidebar .menu-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.5rem; color: #9ca3af; font-weight: 600; transition: all 0.2s; border-right: 3px solid transparent; }
    .admin-sidebar .menu-item:hover, .admin-sidebar .menu-item.active { color: #7c3aed; background: rgba(124, 58, 237, 0.1); border-right-color: #7c3aed; }
  </style>
</head>
<body class="bg-dark-900 text-white font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-dark-600">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-accent/30">
          <i class="fas fa-book-open text-white text-lg"></i>
        </div>
        <span class="text-xl font-bold">Sed<span class="text-accent">box</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="../index.html" class="bg-dark-700 hover:bg-dark-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-home"></i> Site
        </a>
        <button onclick="DB.logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="index.html" class="menu-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="comics.html" class="menu-item"><i class="fas fa-book"></i> Comics</a>
      <a href="chapters.html" class="menu-item"><i class="fas fa-list"></i> Chapters</a>
      <a href="categories.html" class="menu-item"><i class="fas fa-folder"></i> Categories</a>
      <a href="settings.html" class="menu-item active"><i class="fas fa-cog"></i> Settings</a>
    </aside>

    <!-- Main Content -->
    <div class="p-6 lg:p-8">
      <h1 class="text-3xl font-bold mb-8 flex items-center gap-3">
        <span class="w-12 h-12 bg-accent/20 rounded-xl flex items-center justify-center">
          <i class="fas fa-cog text-accent text-xl"></i>
        </span>
        Settings
      </h1>

      <div id="alertBox"></div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Change Password -->
        <div class="bg-dark-700 rounded-2xl border border-dark-500 p-6">
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-lock text-accent"></i> Change Password
          </h2>
          <form id="passwordForm" class="space-y-4">
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-2">Current Password</label>
              <input type="password" id="currentPassword" required
                     class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-2">New Password</label>
              <input type="password" id="newPassword" minlength="4" required
                     class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-2">Confirm Password</label>
              <input type="password" id="confirmPassword" minlength="4" required
                     class="w-full bg-dark-800 border-2 border-dark-500 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition">
            </div>
            <button type="submit" class="w-full bg-accent hover:bg-accent-dark text-white py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </form>
        </div>

        <!-- Export Data -->
        <div class="bg-dark-700 rounded-2xl border border-dark-500 p-6">
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-download text-green-500"></i> Export Data
          </h2>
          <p class="text-gray-400 text-sm mb-4">Export all site data as a JSON backup file.</p>
          <button onclick="exportData()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
            <i class="fas fa-download"></i> Export JSON
          </button>
        </div>

        <!-- Import Data -->
        <div class="bg-dark-700 rounded-2xl border border-dark-500 p-6">
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-upload text-golden"></i> Import Data
          </h2>
          <p class="text-gray-400 text-sm mb-4">Import data from a previously exported JSON file.</p>
          <div class="border-2 border-dashed border-dark-500 rounded-xl p-6 text-center cursor-pointer hover:border-golden transition" id="importDropZone">
            <i class="fas fa-file-import text-3xl text-gray-500 mb-2"></i>
            <p class="text-gray-400 text-sm">Drop JSON file here</p>
            <input type="file" id="importInput" accept=".json" class="hidden">
          </div>
        </div>

        <!-- Danger Zone -->
        <div class="bg-dark-700 rounded-2xl border-2 border-red-500/50 p-6">
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-red-400">
            <i class="fas fa-exclamation-triangle"></i> Danger Zone
          </h2>
          <p class="text-gray-400 text-sm mb-4">Permanently delete all data. This cannot be undone.</p>
          <button onclick="clearAllData()" class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
            <i class="fas fa-trash"></i> Delete All Data
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== 'true') {
      window.location.href = 'login.html';
    }

    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const current = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (newPass !== confirm) {
        showAlert('Passwords do not match', 'danger');
        return;
      }

      const success = await DB.login('admin', current);
      if (!success) {
        showAlert('Current password is incorrect', 'danger');
        return;
      }

      await DB.updatePassword(newPass);
      showAlert('Password changed successfully!', 'success');
      this.reset();
    });

    document.getElementById('importDropZone').addEventListener('click', () => {
      document.getElementById('importInput').click();
    });

    document.getElementById('importInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) importFile(file);
    });

    document.getElementById('importDropZone').addEventListener('dragover', (e) => {
      e.preventDefault();
      e.currentTarget.classList.add('border-golden');
    });

    document.getElementById('importDropZone').addEventListener('dragleave', (e) => {
      e.currentTarget.classList.remove('border-golden');
    });

    document.getElementById('importDropZone').addEventListener('drop', (e) => {
      e.preventDefault();
      e.currentTarget.classList.remove('border-golden');
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.json')) importFile(file);
    });

    function importFile(file) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.comics) {
            for (const [id, comic] of Object.entries(data.comics)) {
              await window.db.ref(`comics/${id}`).set(comic);
            }
          }
          if (data.chapters) {
            for (const [id, chapter] of Object.entries(data.chapters)) {
              await window.db.ref(`chapters/${id}`).set(chapter);
            }
          }
          if (data.categories) {
            for (const [id, cat] of Object.entries(data.categories)) {
              await window.db.ref(`categories/${id}`).set(cat);
            }
          }
          showAlert('Import completed successfully!', 'success');
        } catch (err) {
          showAlert('Error in data file', 'danger');
        }
      };
      reader.readAsText(file);
    }

    async function exportData() {
      showAlert('Exporting...', 'warning');
      const comics = await window.db.ref('comics').once('value');
      const chapters = await window.db.ref('chapters').once('value');
      const categories = await window.db.ref('categories').once('value');

      const data = {
        comics: comics.val() || {},
        chapters: chapters.val() || {},
        categories: categories.val() || {},
        exportDate: new Date().toISOString()
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sedbox-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showAlert('Export completed!', 'success');
    }

    async function clearAllData() {
      if (!confirm('Are you sure you want to delete ALL data?')) return;
      if (!confirm('FINAL WARNING: This will permanently delete everything!')) return;

      await window.db.ref('comics').remove();
      await window.db.ref('chapters').remove();
      await window.db.ref('categories').remove();
      showAlert('All data has been deleted', 'success');
    }

    function showAlert(msg, type) {
      const colors = {
        success: 'bg-green-500/20 border-green-500/50 text-green-400',
        danger: 'bg-red-500/20 border-red-500/50 text-red-400',
        warning: 'bg-golden/20 border-golden/50 text-golden'
      };
      document.getElementById('alertBox').innerHTML = `
        <div class="${colors[type]} border px-4 py-3 rounded-xl text-sm font-medium mb-4">${msg}</div>`;
      if (type !== 'warning') setTimeout(() => { document.getElementById('alertBox').innerHTML = ''; }, 3000);
    }
  </script>
</body>
</html>
