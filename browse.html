<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse - Sedbox Comics</title>
  <meta name="description" content="تصفح جميع القصص المصورة العربية المتاحة في مكتبة Sedbox Comics">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0f0f13', 800: '#13131a', 700: '#1a1a24', 600: '#22222e', 500: '#2a2a38' },
            accent: { DEFAULT: '#7c3aed', light: '#8b5cf6', dark: '#6d28d9' },
            golden: '#fbbf24'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #7c3aed #1a1a24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a24; }
    ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 4px; }
    
    .comic-card { transition: all 0.3s ease; }
    .comic-card:hover { transform: translateY(-8px); }
    .comic-card:hover .cover-img { transform: scale(1.1); }
    .cover-img { transition: transform 0.5s ease; }
    .card-shine { background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 100%); }
    .glass { background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(12px); }
    .tab-active { background: #7c3aed; color: white; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
    
    .update-item:hover { background: rgba(124, 58, 237, 0.1); }
    
    .category-chip {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem; background: #1a1a24;
      border: 2px solid #22222e; border-radius: 9999px;
      color: #9ca3af; font-weight: 600; font-size: 0.875rem;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .category-chip:hover, .category-chip.active {
      background: #7c3aed; color: white; border-color: #7c3aed;
    }
    
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-dark-900 text-white font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-dark-600">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3 flex-shrink-0">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center shadow-lg shadow-accent/30">
          <i class="fas fa-book-open text-white text-lg"></i>
        </div>
        <span class="text-xl font-bold hidden sm:block">Sed<span class="text-accent">box</span></span>
      </a>
      <div class="hidden md:flex items-center gap-1">
        <a href="index.html" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-dark-600 transition font-medium text-sm">Home</a>
        <a href="browse.html" class="px-4 py-2 rounded-lg bg-accent/10 text-accent font-medium text-sm">Browse</a>
        <a href="browse.html?filter=popular" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-dark-600 transition font-medium text-sm">Trending</a>
        <a href="browse.html?filter=latest" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-dark-600 transition font-medium text-sm">Latest</a>
      </div>
      <div class="flex-1 max-w-md hidden sm:block">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Search comics... (Ctrl+K)" 
                 class="w-full bg-dark-700 border border-dark-500 rounded-full px-4 py-2 pl-10 pr-20 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-accent transition"
                 onkeypress="if(event.key==='Enter') doSearch(this.value)">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <kbd class="absolute right-3 top-1/2 -translate-y-1/2 bg-dark-600 text-gray-400 text-xs px-2 py-0.5 rounded border border-dark-500">Ctrl+K</kbd>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="admin/login.html" class="hidden sm:flex items-center gap-2 bg-accent hover:bg-accent-dark text-white px-4 py-2 rounded-full text-sm font-semibold transition shadow-lg shadow-accent/30">
          <i class="fas fa-user"></i> Sign Up
        </a>
        <button onclick="toggleMobileMenu()" class="md:hidden w-10 h-10 rounded-lg bg-dark-700 flex items-center justify-center text-gray-400">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden border-t border-dark-600 bg-dark-800">
      <div class="p-4 space-y-2">
        <a href="index.html" class="block px-4 py-3 rounded-lg text-gray-400 hover:bg-dark-600">Home</a>
        <a href="browse.html" class="block px-4 py-3 rounded-lg bg-accent/10 text-accent font-medium">Browse</a>
        <a href="browse.html?filter=popular" class="block px-4 py-3 rounded-lg text-gray-400 hover:bg-dark-600">Trending</a>
        <a href="browse.html?filter=latest" class="block px-4 py-3 rounded-lg text-gray-400 hover:bg-dark-600">Latest</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-20 pb-12">
    <div class="max-w-7xl mx-auto px-4">

      <!-- Page Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold flex items-center gap-3" id="pageTitle">
          <span class="w-12 h-12 bg-accent/20 rounded-xl flex items-center justify-center">
            <i class="fas fa-th-large text-accent text-xl"></i>
          </span>
          <span id="titleText">Browse All Comics</span>
        </h1>
      </div>

      <!-- Categories Bar -->
      <div class="flex flex-wrap gap-2 mb-8" id="categoriesBar"></div>

      <!-- Filters -->
      <div class="flex flex-wrap items-center gap-4 mb-8 p-4 bg-dark-700 rounded-2xl border border-dark-500">
        <div class="flex items-center gap-2">
          <i class="fas fa-filter text-gray-500"></i>
          <span class="text-sm text-gray-400">Sort by:</span>
        </div>
        <select id="sortSelect" onchange="applyFilters()" class="bg-dark-600 border border-dark-500 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-accent">
          <option value="latest">Latest First</option>
          <option value="popular">Most Popular</option>
          <option value="rating">Highest Rating</option>
          <option value="az">A - Z</option>
        </select>
        <div class="flex items-center gap-2 ml-auto">
          <button onclick="setView('grid')" id="viewGrid" class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center text-white">
            <i class="fas fa-th"></i>
          </button>
          <button onclick="setView('list')" id="viewList" class="w-10 h-10 rounded-lg bg-dark-600 flex items-center justify-center text-gray-400 hover:text-white transition">
            <i class="fas fa-list"></i>
          </button>
        </div>
      </div>

      <!-- Results Count -->
      <div class="flex items-center justify-between mb-6">
        <p class="text-gray-400 text-sm">
          Showing <span id="resultsCount" class="text-white font-semibold">0</span> results
        </p>
      </div>

      <!-- Comics Grid -->
      <div id="comicsList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16">
        <i class="fas fa-search text-6xl text-gray-600 mb-4"></i>
        <h3 class="text-xl font-bold mb-2">No results found</h3>
        <p class="text-gray-500 mb-6">Try searching with different keywords</p>
        <a href="browse.html" class="inline-flex items-center gap-2 bg-accent hover:bg-accent-dark text-white px-6 py-3 rounded-full font-semibold transition">
          <i class="fas fa-refresh"></i> Reset Filters
        </a>
      </div>

      <!-- Pagination -->
      <div class="flex justify-center" id="pagination"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark-800 border-t border-dark-600 mt-12">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
      © 2026 Sedbox Comics. All rights reserved.
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script>
    let allComics = [];
    let filteredComics = [];
    let currentPage = 1;
    const ITEMS_PER_PAGE = 20;
    let currentView = 'grid';
    let currentCategory = '';

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      
      const urlParams = new URLSearchParams(window.location.search);
      const filter = urlParams.get('filter');
      const category = urlParams.get('category');
      const search = urlParams.get('search');
      
      if (filter === 'popular') {
        document.getElementById('titleText').textContent = 'Trending Comics';
      } else if (filter === 'latest') {
        document.getElementById('titleText').textContent = 'Latest Updates';
      } else if (category) {
        document.getElementById('titleText').textContent = category;
        currentCategory = category;
      } else if (search) {
        document.getElementById('titleText').textContent = `Search: "${search}"`;
        document.getElementById('searchInput').value = search;
      }

      const categories = await DB.getCategories();
      document.getElementById('categoriesBar').innerHTML = 
        `<button class="category-chip ${!currentCategory ? 'active' : ''}" onclick="filterByCategory('')">
          <i class="fas fa-globe"></i> All
        </button>` +
        categories.map(cat => `
          <button class="category-chip ${currentCategory === cat.name ? 'active' : ''}" onclick="filterByCategory('${cat.name}')">
            ${cat.name}
          </button>
        `).join('');

      if (filter === 'popular') {
        allComics = await DB.getMostViewedComics(100);
      } else if (filter === 'latest') {
        allComics = await DB.getLatestComics(100);
      } else if (search) {
        allComics = await DB.searchComics(search);
      } else {
        allComics = await DB.getLatestComics(100);
      }

      applyFilters();
    });

    function applyFilters() {
      const sort = document.getElementById('sortSelect').value;
      
      filteredComics = [...allComics];
      
      if (currentCategory) {
        filteredComics = filteredComics.filter(c => c.category === currentCategory);
      }

      switch(sort) {
        case 'popular':
          filteredComics.sort((a, b) => (b.views || 0) - (a.views || 0));
          break;
        case 'rating':
          filteredComics.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          break;
        case 'az':
          filteredComics.sort((a, b) => a.title.localeCompare(b.title));
          break;
        default:
          filteredComics.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      }

      document.getElementById('resultsCount').textContent = filteredComics.length;
      currentPage = 1;
      renderPage();
    }

    function filterByCategory(category) {
      currentCategory = category;
      const url = new URL(window.location);
      if (category) {
        url.searchParams.set('category', category);
      } else {
        url.searchParams.delete('category');
      }
      window.history.pushState({}, '', url);
      
      document.querySelectorAll('.category-chip').forEach(chip => {
        chip.classList.remove('active');
        if ((category === '' && chip.textContent.includes('All')) || chip.textContent.includes(category)) {
          chip.classList.add('active');
        }
      });
      
      applyFilters();
    }

    function renderPage() {
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageComics = filteredComics.slice(start, end);
      
      const container = document.getElementById('comicsList');
      const emptyState = document.getElementById('emptyState');
      
      if (pageComics.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      emptyState.classList.add('hidden');
      container.innerHTML = pageComics.map(comic => renderComicCard(comic)).join('');
      
      renderPagination();
    }

    function renderComicCard(comic) {
      return `
        <a href="comic.html?id=${comic.id}" class="comic-card block bg-dark-700 rounded-xl overflow-hidden border border-dark-500 hover:border-accent/50 transition group">
          <div class="relative aspect-[3/4] overflow-hidden">
            <img src="${comic.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" alt="${comic.title}" class="cover-img w-full h-full object-cover">
            <div class="absolute inset-0 card-shine"></div>
            <div class="absolute top-2 right-2 bg-accent/90 backdrop-blur px-2 py-0.5 rounded-md text-xs font-bold">
              ${comic.category || 'Manga'}
            </div>
            <div class="absolute top-2 left-2 bg-black/70 backdrop-blur px-2 py-0.5 rounded-md text-xs font-medium flex items-center gap-1">
              <i class="fas fa-star text-golden text-[10px]"></i> ${(comic.rating || 0).toFixed(1)}
            </div>
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-3 opacity-0 group-hover:opacity-100 transition">
              <span class="text-xs bg-accent px-2 py-1 rounded-full font-medium">Read Now</span>
            </div>
          </div>
          <div class="p-3">
            <h4 class="font-semibold text-sm line-clamp-1 group-hover:text-accent transition">${comic.title}</h4>
            <div class="text-gray-500 text-xs mt-1 flex items-center gap-2">
              <span><i class="fas fa-eye"></i> ${formatNumber(comic.views || 0)}</span>
              <span>•</span>
              <span>${comic.author || 'Unknown'}</span>
            </div>
          </div>
        </a>`;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredComics.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      
      let html = '';
      
      if (currentPage > 1) {
        html += `<button onclick="goToPage(${currentPage - 1})" class="w-10 h-10 rounded-lg bg-dark-700 border border-dark-500 text-white hover:bg-accent hover:border-accent transition flex items-center justify-center">
          <i class="fas fa-chevron-right text-sm"></i>
        </button>`;
      }
      
      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `<button class="w-10 h-10 rounded-lg bg-accent text-white font-bold">${i}</button>`;
        } else if (Math.abs(i - currentPage) <= 2 || i === 1 || i === totalPages) {
          html += `<button onclick="goToPage(${i})" class="w-10 h-10 rounded-lg bg-dark-700 border border-dark-500 text-gray-400 hover:text-white hover:bg-dark-600 transition">${i}</button>`;
        } else if (Math.abs(i - currentPage) === 3) {
          html += `<span class="w-10 h-10 flex items-center justify-center text-gray-500">...</span>`;
        }
      }
      
      if (currentPage < totalPages) {
        html += `<button onclick="goToPage(${currentPage + 1})" class="w-10 h-10 rounded-lg bg-dark-700 border border-dark-500 text-white hover:bg-accent hover:border-accent transition flex items-center justify-center">
          <i class="fas fa-chevron-left text-sm"></i>
        </button>`;
      }
      
      document.getElementById('pagination').innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setView(view) {
      currentView = view;
      const container = document.getElementById('comicsList');
      
      if (view === 'grid') {
        container.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-8';
        document.getElementById('viewGrid').className = 'w-10 h-10 rounded-lg bg-accent flex items-center justify-center text-white';
        document.getElementById('viewList').className = 'w-10 h-10 rounded-lg bg-dark-600 flex items-center justify-center text-gray-400 hover:text-white transition';
      } else {
        container.className = 'space-y-4 mb-8';
        document.getElementById('viewGrid').className = 'w-10 h-10 rounded-lg bg-dark-600 flex items-center justify-center text-gray-400 hover:text-white transition';
        document.getElementById('viewList').className = 'w-10 h-10 rounded-lg bg-accent flex items-center justify-center text-white';
      }
      
      renderPage();
    }

    function renderListItem(comic) {
      return `
        <a href="comic.html?id=${comic.id}" class="update-item flex gap-4 p-4 bg-dark-700 rounded-xl border border-dark-500 hover:border-accent/30 transition">
          <img src="${comic.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" alt="${comic.title}" class="w-20 h-28 object-cover rounded-lg flex-shrink-0">
          <div class="flex-1 min-w-0">
            <h4 class="font-semibold line-clamp-1 hover:text-accent transition">${comic.title}</h4>
            <p class="text-gray-500 text-sm mt-1 line-clamp-2">${comic.description || 'No description available'}</p>
            <div class="flex items-center gap-4 mt-2 text-xs text-gray-400">
              <span class="bg-accent/20 text-accent px-2 py-0.5 rounded">${comic.category || 'Manga'}</span>
              <span><i class="fas fa-eye"></i> ${formatNumber(comic.views || 0)}</span>
              <span><i class="fas fa-star text-golden"></i> ${(comic.rating || 0).toFixed(1)}</span>
              <span><i class="fas fa-user"></i> ${comic.author || 'Unknown'}</span>
            </div>
          </div>
        </a>`;
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    function doSearch(val) {
      if (val.trim()) window.location.href = `browse.html?search=${encodeURIComponent(val.trim())}`;
    }

    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('hidden');
    }

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });
  </script>
</body>
</html>
