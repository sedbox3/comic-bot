<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصفح الكوميكس - كوميكس عربية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent); width:32px; height:32px;">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
      كوميكس عربية
    </a>
    <div class="navbar-links" id="navLinks">
      <a href="index.html">الرئيسية</a>
      <a href="browse.html" class="active">تصفح</a>
      <a href="browse.html?filter=popular">الأكثر قراءة</a>
      <a href="browse.html?filter=latest">أحدث الإضافات</a>
    </div>
    <div class="navbar-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن كوميكس..."
               onkeypress="if(event.key==='Enter') UI.doSearch(this.value)">
        <span class="search-icon"><i class="fas fa-search"></i></span>
      </div>
      <button class="theme-toggle" onclick="UI.toggleTheme()" title="تبديل الثيم">
        <i class="fas fa-sun"></i>
      </button>
      <button class="mobile-menu-btn" onclick="UI.toggleMobileMenu()">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <section class="section">
      <!-- عنوان الصفحة -->
      <div id="pageTitle" class="section-header" style="margin-bottom: 1rem;"></div>
      
      <!-- شريط التصنيفات -->
      <div id="categoriesBar"></div>
      
      <!-- معلومات البحث -->
      <div id="searchInfo" class="search-results-info"></div>
      
      <!-- شبكة الكوميكس -->
      <div id="comicsGrid"></div>
      
      <!-- ترقيم الصفحات -->
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 كوميكس عربية. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let currentPage = 1;
    const ITEMS_PER_PAGE = 12;
    let currentComics = [];

    document.addEventListener('DOMContentLoaded', async function() {
      // تهيئة Firebase
      await DB.init();
      
      const searchQuery = UI.getUrlParam('search');
      const category = UI.getUrlParam('category');
      const filter = UI.getUrlParam('filter');
      const page = parseInt(UI.getUrlParam('page')) || 1;
      currentPage = page;

      // عنوان الصفحة
      let title = 'تصفح جميع الكوميكس';
      let icon = 'fa-book-open';
      
      if (searchQuery) {
        title = `نتائج البحث: "${searchQuery}"`;
        icon = 'fa-search';
      } else if (category) {
        title = `التصنيف: ${category}`;
        icon = 'fa-folder';
      } else if (filter === 'popular') {
        title = 'الأكثر قراءة';
        icon = 'fa-fire';
      } else if (filter === 'latest') {
        title = 'أحدث الإضافات';
        icon = 'fa-clock';
      }

      document.getElementById('pageTitle').innerHTML = `
        <h2 class="section-title"><i class="fas ${icon}"></i> ${title}</h2>
      `;

      // تحميل التصنيفات
      document.getElementById('categoriesBar').innerHTML = await UI.renderCategoriesBar(category);

      // تحميل الكوميكس
      await loadComics(searchQuery, category, filter);
      UI.loadTheme();
    });

    async function loadComics(search, category, filter) {
      let comics = [];

      if (search) {
        comics = await DB.searchComics(search);
        document.getElementById('searchInfo').innerHTML = 
          `<p>تم العثور على <strong>${comics.length}</strong> نتيجة</p>`;
      } else if (category) {
        comics = await DB.getComicsByCategory(category);
      } else if (filter === 'popular') {
        comics = await DB.getMostViewedComics(100);
      } else if (filter === 'latest') {
        comics = await DB.getLatestComics(100);
      } else {
        comics = await DB.getComics();
      }

      // تصفية المنشورة فقط
      comics = comics.filter(c => c.status === 'published');
      currentComics = comics;

      renderPage();
    }

    async function renderPage() {
      const totalPages = Math.ceil(currentComics.length / ITEMS_PER_PAGE);
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageComics = currentComics.slice(start, start + ITEMS_PER_PAGE);

      document.getElementById('comicsGrid').innerHTML = await UI.renderComicsGrid(pageComics);

      // الترقيم
      if (totalPages > 1) {
        let paginationHTML = '';
        for (let i = 1; i <= totalPages; i++) {
          paginationHTML += `<button class="${i === currentPage ? 'active' : ''}" 
                              onclick="goToPage(${i})">${i}</button>`;
        }
        document.getElementById('pagination').innerHTML = paginationHTML;
      } else {
        document.getElementById('pagination').innerHTML = '';
      }
    }

    function goToPage(page) {
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
