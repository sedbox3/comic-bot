<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القارئ - Sedbox Comics</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    .reader-container { position: fixed; inset: 0; z-index: 2000; }
  </style>
</head>
<body>
  <div class="reader-container">
    <div class="reader-header">
      <div>
        <div style="font-weight: 700;" id="comicTitle">العنوان</div>
        <div style="font-size: 0.85rem; color: #aaa;" id="chapterInfo">الفصل 1</div>
      </div>
      <div class="reader-controls">
        <button onclick="toggleReaderMode()" title="تغيير الوضع" id="modeBtn">
          <i class="fas fa-columns"></i>
        </button>
        <button onclick="zoomIn()" title="تكبير"><i class="fas fa-search-plus"></i></button>
        <button onclick="zoomOut()" title="تصغير"><i class="fas fa-search-minus"></i></button>
        <button onclick="closeReader()" title="إغلاق"><i class="fas fa-times"></i></button>
      </div>
    </div>
    
    <div class="reader-body" id="readerBody"></div>
    
    <div class="reader-footer">
      <button class="btn btn-secondary btn-sm" onclick="prevChapter()" id="prevChapterBtn">
        <i class="fas fa-arrow-right"></i> الفصل السابق
      </button>
      <select id="chapterSelect" onchange="goToChapter(this.value)"></select>
      <span id="pageIndicator" style="font-weight: 700;">1 / 1</span>
      <button class="btn btn-secondary btn-sm" onclick="nextChapter()" id="nextChapterBtn">
        الفصل التالي <i class="fas fa-arrow-left"></i>
      </button>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    let comicId, chapters = [], currentChapterIndex = 0;
    let currentMode = 'scroll';
    let currentPage = 0;
    let zoomLevel = 1;

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      
      const params = new URLSearchParams(window.location.search);
      comicId = params.get('comic');
      const chapterId = params.get('chapter');
      
      if (!comicId) { closeReader(); return; }
      
      const comic = await DB.getComicById(comicId);
      if (!comic) { closeReader(); return; }
      
      document.getElementById('comicTitle').textContent = comic.title;
      
      chapters = await DB.getChapters(comicId);
      if (chapters.length === 0) { closeReader(); return; }
      
      chapters.sort((a, b) => (a.number || 0) - (b.number || 0));
      
      const select = document.getElementById('chapterSelect');
      select.innerHTML = chapters.map((ch, i) => 
        `<option value="${i}">الفصل ${ch.number || i+1}: ${ch.title}</option>`
      ).join('');
      
      if (chapterId) {
        const idx = chapters.findIndex(ch => ch.id === chapterId);
        if (idx >= 0) currentChapterIndex = idx;
      }
      
      loadChapter(currentChapterIndex);
      setupKeyboardNav();
    });

    function loadChapter(index) {
      if (index < 0 || index >= chapters.length) return;
      currentChapterIndex = index;
      currentPage = 0;
      zoomLevel = 1;
      
      document.getElementById('chapterSelect').value = index;
      document.getElementById('chapterInfo').textContent = 
        `الفصل ${chapters[index].number || index+1}: ${chapters[index].title}`;
      
      document.getElementById('prevChapterBtn').disabled = index === 0;
      document.getElementById('nextChapterBtn').disabled = index === chapters.length - 1;
      
      const chapter = chapters[index];
      const readerBody = document.getElementById('readerBody');
      readerBody.innerHTML = '';
      readerBody.className = currentMode === 'page' ? 'reader-body page-mode' : 'reader-body';
      
      if (!chapter.images || chapter.images.length === 0) {
        readerBody.innerHTML = `
          <div style="text-align: center; color: #fff; padding: 3rem;">
            <i class="fas fa-images" style="font-size: 4rem; opacity: 0.3;"></i>
            <h3 style="margin-top: 1rem;">لا توجد صور</h3>
          </div>`;
        updatePageIndicator(0, 0);
        return;
      }
      
      if (currentMode === 'scroll') {
        chapter.images.forEach((img, i) => {
          const imgEl = document.createElement('img');
          imgEl.src = img;
          imgEl.alt = `صفحة ${i + 1}`;
          imgEl.style.width = '100%';
          imgEl.style.maxWidth = '800px';
          imgEl.loading = 'lazy';
          readerBody.appendChild(imgEl);
        });
        updatePageIndicator(1, chapter.images.length);
      } else {
        showPage(0);
      }
    }

    function showPage(index) {
      const chapter = chapters[currentChapterIndex];
      if (!chapter.images || index < 0 || index >= chapter.images.length) return;
      currentPage = index;
      
      const readerBody = document.getElementById('readerBody');
      readerBody.innerHTML = `<img src="${chapter.images[index]}" style="transform: scale(${zoomLevel}); transition: transform 0.3s;">`;
      readerBody.className = 'reader-body page-mode';
      
      updatePageIndicator(index + 1, chapter.images.length);
    }

    function updatePageIndicator(current, total) {
      document.getElementById('pageIndicator').textContent = `${current} / ${total}`;
    }

    function toggleReaderMode() {
      currentMode = currentMode === 'scroll' ? 'page' : 'scroll';
      document.getElementById('modeBtn').innerHTML = 
        currentMode === 'scroll' ? '<i class="fas fa-columns"></i>' : '<i class="fas fa-list"></i>';
      loadChapter(currentChapterIndex);
    }

    function zoomIn() { zoomLevel = Math.min(3, zoomLevel + 0.25); applyZoom(); }
    function zoomOut() { zoomLevel = Math.max(0.5, zoomLevel - 0.25); applyZoom(); }
    function applyZoom() {
      const img = document.querySelector('#readerBody img');
      if (img) img.style.transform = `scale(${zoomLevel})`;
    }

    function prevChapter() { loadChapter(currentChapterIndex - 1); }
    function nextChapter() { loadChapter(currentChapterIndex + 1); }
    function goToChapter(index) { loadChapter(parseInt(index)); }

    function setupKeyboardNav() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (currentMode === 'page') {
            if (currentPage > 0) showPage(currentPage - 1);
            else if (currentChapterIndex > 0) prevChapter();
          }
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
          e.preventDefault();
          if (currentMode === 'page') {
            const maxPage = chapters[currentChapterIndex].images.length - 1;
            if (currentPage < maxPage) showPage(currentPage + 1);
            else if (currentChapterIndex < chapters.length - 1) nextChapter();
          }
        }
        if (e.key === 'Escape') closeReader();
        if (e.key === '+' || e.key === '=') zoomIn();
        if (e.key === '-') zoomOut();
      });
    }

    function closeReader() {
      if (comicId) window.location.href = `comic.html?id=${comicId}`;
      else window.location.href = '../index.html';
    }
  </script>
</body>
</html>
