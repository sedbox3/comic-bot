<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل الكوميكس - Sedbox Comics</title>
  <meta name="description" content="تفاصيل القصة المصورة والفصل المتاحة للقراءة">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span class="logo-text">Sedbox Comics</span>
    </a>
    <div class="navbar-links" id="navLinks">
      <a href="index.html">الرئيسية</a>
      <a href="browse.html">تصفح</a>
      <a href="browse.html?filter=popular">الأكثر قراءة</a>
      <a href="browse.html?filter=latest">أحدث الإضافات</a>
    </div>
    <div class="navbar-actions">
      <button class="theme-toggle" onclick="UI.toggleTheme()"><i class="fas fa-sun"></i></button>
      <button class="mobile-menu-btn" onclick="UI.toggleMobileMenu()"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <main class="main-content">
    <div class="comic-detail" id="comicDetail">
      <div class="cover-section" id="coverSection"></div>
      <div class="info-section" id="infoSection">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 Sedbox Comics. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let currentComic = null;

    document.addEventListener('DOMContentLoaded', async function() {
      await DB.init();
      UI.loadTheme();

      const urlParams = new URLSearchParams(window.location.search);
      const comicId = urlParams.get('id');

      if (!comicId) {
        document.getElementById('infoSection').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>لم يتم العثور على الكوميكس</h3>
            <a href="browse.html" class="btn btn-primary"><i class="fas fa-arrow-right"></i> تصفح الكوميكس</a>
          </div>`;
        return;
      }

      const comic = await DB.getComicById(comicId);
      if (!comic) {
        document.getElementById('infoSection').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>لم يتم العثور على الكوميكس</h3>
            <a href="browse.html" class="btn btn-primary"><i class="fas fa-arrow-right"></i> تصفح الكوميكس</a>
          </div>`;
        return;
      }

      currentComic = comic;
      DB.updateViews(comicId);

      document.title = `${comic.title} - Sedbox Comics`;

      const chapters = await DB.getChapters(comicId);

      document.getElementById('coverSection').innerHTML = `
        <img src="${comic.cover}" alt="${comic.title}">
      `;

      document.getElementById('infoSection').innerHTML = `
        <h1>${comic.title}</h1>
        
        <div class="meta-row">
          <div class="meta-item">
            <i class="fas fa-folder" style="color: var(--accent);"></i>
            ${comic.category || 'غير محدد'}
          </div>
          <div class="meta-item">
            <i class="fas fa-eye" style="color: var(--accent2);"></i>
            ${UI.formatNumber(comic.views || 0)} مشاهدة
          </div>
          <div class="meta-item">
            <i class="fas fa-star" style="color: var(--accent3);"></i>
            ${comic.rating || '0'}
          </div>
          <div class="meta-item">
            <i class="fas fa-book" style="color: var(--accent4);"></i>
            ${chapters.length} فصل
          </div>
        </div>

        ${comic.description ? `
          <div class="description">
            <p>${comic.description}</p>
          </div>
        ` : ''}

        ${comic.author ? `
          <div class="meta-row">
            <div class="meta-item">
              <i class="fas fa-user-pen" style="color: var(--accent5);"></i>
              ${comic.author}
            </div>
          </div>
        ` : ''}

        <div class="action-buttons">
          ${chapters.length > 0 ? `
            <a href="reader.html?comic=${comicId}&chapter=${chapters[0].id}" class="btn btn-primary">
              <i class="fas fa-play"></i> ابدأ القراءة
            </a>
          ` : ''}
          <a href="browse.html?category=${comic.category}" class="btn btn-secondary">
            <i class="fas fa-folder"></i> ${comic.category}
          </a>
        </div>

        <div class="chapters-list">
          <h2 class="section-title" style="font-size: 1.5rem; margin-bottom: 1rem;">
            <span class="icon"><i class="fas fa-list"></i></span>
            الفصول (${chapters.length})
          </h2>
          ${chapters.length === 0 ? `
            <div class="empty-state">
              <div class="empty-icon"><i class="fas fa-book-open"></i></div>
              <h3>لا توجد فصول بعد</h3>
              <p>لم يتم إضافة أي فصل لهذا الكوميكس.</p>
            </div>
          ` : chapters.map((ch, index) => `
            <a href="reader.html?comic=${comicId}&chapter=${ch.id}" class="chapter-item slide-in" style="animation-delay: ${index * 0.05}s">
              <div>
                <div class="chapter-title">الفصل ${ch.number || index + 1}: ${ch.title}</div>
                <div class="chapter-meta">
                  <i class="fas fa-image"></i> ${ch.images ? ch.images.length : 0} صفحة
                </div>
              </div>
              <div style="color: var(--accent); font-size: 1.2rem;">
                <i class="fas fa-arrow-left"></i>
              </div>
            </a>
          `).join('')}
        </div>
      `;
    });
  </script>
</body>
</html>
